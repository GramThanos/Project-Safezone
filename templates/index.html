<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Safehouse - Server Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            padding: 40px 0;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-label {
            color: #666;
            font-weight: 500;
        }
        
        .status-value {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .status-healthy {
            background: #d4edda;
            color: #155724;
        }
        
        .status-connected {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status-disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-running {
            background: #d4edda;
            color: #155724;
        }
        
        .status-stopped {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-unknown {
            background: #e2e3e5;
            color: #383d41;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏠 Project Safehouse</h1>
            <p class="subtitle">Project Zomboid Dedicated Server Manager</p>
        </header>
        
        <div class="dashboard">
            <div class="card">
                <h2>System Status</h2>
                <div id="system-status" class="loading">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
            </div>
            
            <div class="card">
                <h2>Game Server</h2>
                <div id="server-status" class="loading">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function getStatusClass(value) {
            const lowerValue = value.toLowerCase();
            if (lowerValue === 'healthy' || lowerValue === 'running') return 'status-healthy';
            if (lowerValue === 'connected') return 'status-connected';
            if (lowerValue === 'disconnected' || lowerValue === 'not_installed') return 'status-disconnected';
            if (lowerValue === 'stopped') return 'status-stopped';
            return 'status-unknown';
        }
        
        async function loadSystemStatus() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                
                const escapeHtml = (text) => {
                    const div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                };
                
                const statusHtml = `
                    <div class="status-item">
                        <span class="status-label">Application</span>
                        <span class="status-value ${getStatusClass(data.status)}">${escapeHtml(data.status)}</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Database</span>
                        <span class="status-value ${getStatusClass(data.database)}">${escapeHtml(data.database)}</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Cache</span>
                        <span class="status-value ${getStatusClass(data.cache)}">${escapeHtml(data.cache)}</span>
                    </div>
                `;
                
                document.getElementById('system-status').innerHTML = statusHtml;
            } catch (error) {
                document.getElementById('system-status').innerHTML = '<p>Error loading status</p>';
                console.error('Error:', error);
            }
        }
        
        async function loadServerStatus() {
            try {
                const response = await fetch('/api/server/status');
                const data = await response.json();
                
                const escapeHtml = (text) => {
                    const div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                };
                
                const statusHtml = `
                    <div class="status-item">
                        <span class="status-label">Server Status</span>
                        <span class="status-value ${getStatusClass(data.status)}">${escapeHtml(data.status)}</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Last Update</span>
                        <span class="status-value status-unknown">${escapeHtml(data.last_update)}</span>
                    </div>
                `;
                
                document.getElementById('server-status').innerHTML = statusHtml;
            } catch (error) {
                document.getElementById('server-status').innerHTML = '<p>Error loading server status</p>';
                console.error('Error:', error);
            }
        }
        
        // Load status on page load
        loadSystemStatus();
        loadServerStatus();
        
        // Refresh every 10 seconds
        setInterval(() => {
            loadSystemStatus();
            loadServerStatus();
        }, 10000);
    </script>
</body>
</html>

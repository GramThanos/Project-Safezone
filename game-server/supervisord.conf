[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
pidfile=/tmp/supervisord.pid

[program:manager_api]
command=python3 /app/manager_api.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
user=steam

[program:manager_tasks]
command=python3 /app/manager_tasks.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
user=steam

[program:manager_game]
command=python3 /app/manager_game.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
user=steam

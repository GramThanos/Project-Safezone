[supervisord]
nodaemon=true
user=steam
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

[program:api_service]
command=python3 /app/api_service.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/api_service.err.log
stdout_logfile=/var/log/supervisor/api_service.out.log
user=steam

[program:task_processor]
command=python3 /app/task_processor.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/task_processor.err.log
stdout_logfile=/var/log/supervisor/task_processor.out.log
user=steam

upstream backend_api {
    server backend:5000;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Backup upload/download move whole world archives, which are far larger
    # than the 1M nginx default would allow. Scoped to this one path so the rest
    # of the API keeps a tight body limit. Matched before the general /api block
    # below — nginx tries regex locations in order.
    location ~ ^/api/admin/servers/[0-9]+/backups(/.*)?$ {
        client_max_body_size 4G;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A large upload/download should not be cut off by the proxy read timeout.
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # Proxy /api and /health requests to backend
    location ~ ^/(api|health)(/.*)?$ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # Security headers for the *document*.
        #
        # The backend sets an equivalent set in `add_security_headers`, but
        # `@app.after_request` only fires for Flask responses - which behind
        # this config means /api and /health. Those are JSON: a framing or
        # script policy on them protects nothing. The origin that runs script
        # and holds the session token in localStorage is this one, served
        # straight from disk by nginx, and it had no headers at all.
        #
        # Declared here rather than at server level on purpose, so the proxied
        # /api responses keep the backend's headers instead of carrying two
        # copies of everything.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # The policy has to admit what index.html actually loads: Bootstrap and
        # Chart.js from jsDelivr, Font Awesome from cdnjs, and Google Fonts.
        # Those <script> and <link> tags carry SRI hashes, so pinning the hosts
        # here is the second half of that protection rather than a substitute.
        #
        #   img-src  'https:' is deliberately broad. Item icons come from
        #            pzwiki.net, Workshop previews from Steam's image CDNs, and
        #            reward icons are a URL an admin types - so the set is not
        #            enumerable. Allowing any HTTPS image still blocks mixed
        #            content, and images are the least dangerous thing to admit.
        #   data:    the signup CAPTCHA is an inline SVG data URI.
        #   style-src 'unsafe-inline' is required by the Bootstrap components;
        #            React's style={{}} prop goes through the CSSOM and is not
        #            affected by this either way.
        #   script-src has no 'unsafe-inline' and no 'unsafe-eval', which is the
        #            directive that actually matters. See INLINE_RUNTIME_CHUNK
        #            in the Dockerfile for why that is possible.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}

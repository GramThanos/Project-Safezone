version: '3.8'

services:
  # SteamCMD and Server Monitor
  steamcmd-manager:
    build: ./steamcmd-manager
    container_name: safehouse_steamcmd_manager
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - CHECK_INTERVAL=30
      - STEAMCMD_PATH=/home/steam/steamcmd
    depends_on:
      - cache
    volumes:
      - steamcmd_data:/home/steam/steamcmd
      - game_data:/home/steam/Steam
    restart: unless-stopped
    networks:
      - safehouse_network

  # Flask Backend API
  backend:
    build: ./backend
    container_name: safehouse_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=${DATABASE_NAME:-safehouse}
      - DATABASE_USER=${DATABASE_USER:-safehouse}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-safehouse}
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    depends_on:
      - db
      - cache
    restart: unless-stopped
    networks:
      - safehouse_network

  # React Frontend
  frontend:
    build: 
      context: ./frontend
      args:
        - REACT_APP_API_URL=http://localhost:5000
    container_name: safehouse_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - safehouse_network

  # MariaDB Database
  db:
    image: mariadb:11
    container_name: safehouse_db
    environment:
      - MYSQL_DATABASE=${DATABASE_NAME:-safehouse}
      - MYSQL_USER=${DATABASE_USER:-safehouse}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD:-safehouse}
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD:-safehouse_root}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - safehouse_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  cache:
    image: redis:7-alpine
    container_name: safehouse_cache
    restart: unless-stopped
    networks:
      - safehouse_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local
  steamcmd_data:
    driver: local
  game_data:
    driver: local

networks:
  safehouse_network:
    driver: bridge

name: safezone
services:
  # Game Server and Manager
  game-server:
    build: ./game-server
    container_name: game_server
    ports:
      - "5001:5001"
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - CHECK_INTERVAL=30
      - STEAMCMD_PATH=/home/steam/steamcmd
      - DATABASE_HOST=db
      - DATABASE_NAME=${DATABASE_NAME:-safezone}
      - DATABASE_USER=${DATABASE_USER:-safezone}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-safezone}
      - API_TOKEN=${API_TOKEN:-safezone-api-token-change-me}
      - PROCESS_INTERVAL=5
    depends_on:
      - db
      - cache
    volumes:
      - steamcmd_data:/home/steam/steamcmd
      - game_data:/home/steam/Steam
    restart: unless-stopped
    networks:
      - default
      - safezone_network

  # Flask Backend API
  backend:
    build: ./backend
    container_name: backend
    #ports:
    #  - "5000:5000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=${DATABASE_NAME:-safezone}
      - DATABASE_USER=${DATABASE_USER:-safezone}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-safezone}
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - TOKEN_EXPIRY_HOURS=${TOKEN_EXPIRY_HOURS:-24}
      - GAME_SERVER_API_URL=http://game-server:5001
      - API_TOKEN=${API_TOKEN:-safezone-api-token-change-me}
    depends_on:
      - db
      - cache
    restart: unless-stopped
    networks:
      - safezone_network

  # React Frontend
  frontend:
    build: ./frontend
    container_name: safezone_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - safezone_network

  # MariaDB Database
  db:
    image: mariadb:11
    container_name: db
    environment:
      - MYSQL_DATABASE=${DATABASE_NAME:-safezone}
      - MYSQL_USER=${DATABASE_USER:-safezone}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD:-safezone}
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD:-safezone_root}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - safezone_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  cache:
    image: redis:7-alpine
    container_name: cache
    restart: unless-stopped
    networks:
      - safezone_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local
  steamcmd_data:
    driver: local
  game_data:
    driver: local

networks:
  default:
  safezone_network:
    internal: true

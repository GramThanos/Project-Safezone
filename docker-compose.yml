name: safezone
services:
  # Game Server and Manager
  game-server:
    build: ./game-server
    container_name: safezone_game_server
    # The manager API listens on MANAGER_API_PORT (5000) inside the container;
    # publish it on host port 5001.
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "5001:5000"
    environment:
      - TZ=Athens/Europe
      - DATABASE_URL=mysql+pymysql://safezone:S4feZone_D4tabas3_Pas5w0rd@db/safezone
      - CACHE_URL=redis://cache:6379
      - MANAGER_API_PORT=5000
      - MANAGER_API_TOKEN=S4feZone_API_T0k3n
      #- STEAM_APP_BETA=42.13.1
      - STEAM_INSTALL_DIR=/opt/steam-apps
    depends_on:
      - db
      - cache
    volumes:
      - game_data:/opt/steam-apps
    #  - steamcmd_data:/home/steam/steamcmd
    #  - game_data:/home/steam/Steam
    restart: unless-stopped
    networks:
      - default
      - safezone_network

  # Flask Backend API
  backend:
    build: ./backend
    container_name: safezone_web_backend
    #ports:
    #  - "5000:5000"
    environment:
      - TZ=Athens/Europe
      - DATABASE_HOST=db
      - DATABASE_NAME=safezone
      - DATABASE_USER=safezone
      - DATABASE_PASSWORD=S4feZone_D4tabas3_Pas5w0rd
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - SECRET_KEY=S4feZone_W3bApp_S3cr3t_K3y
      - TOKEN_EXPIRY_HOURS=${TOKEN_EXPIRY_HOURS:-24}
      - API_TOKEN=S4feZone_API_T0k3n
      - GAME_SERVER_API_URL=http://game-server:5000
    depends_on:
      - db
      - cache
    restart: unless-stopped
    networks:
      - safezone_network

  # React Frontend
  frontend:
    build: ./frontend
    container_name: safezone_web_frontend
    ports:
      - "8080:80"
    environment:
      - TZ=Athens/Europe
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - safezone_network

  # MariaDB Database
  db:
    image: mariadb:11
    container_name: safezone_db
    environment:
      - TZ=Athens/Europe
      - MYSQL_DATABASE=safezone
      - MYSQL_USER=safezone
      - MYSQL_PASSWORD=S4feZone_D4tabas3_Pas5w0rd
      - MYSQL_ROOT_PASSWORD=S4feZone_D4tabas3_Pas5w0rd
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - safezone_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  cache:
    image: redis:7-alpine
    container_name: safezone_cache
    environment:
      - TZ=Athens/Europe
    restart: unless-stopped
    networks:
      - safezone_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local
  steamcmd_data:
    driver: local
  game_data:
    driver: local

networks:
  default:
  safezone_network:
    internal: true
